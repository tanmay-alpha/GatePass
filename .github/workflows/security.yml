name: Security
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 4 * * 1' # weekly full-history secret scan with current rules
  workflow_dispatch:
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  # Gitleaks CLI (MIT licensed; the CLI needs no license key, unlike the
  # gitleaks-action for organisations). Pull requests scan only their own
  # commits; pushes to main, the weekly run and manual runs scan the full
  # history. Findings are printed redacted: secret values never reach the log.
  secrets:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      # gitleaks_8.30.1_linux_x64.tar.gz from gitleaks_8.30.1_checksums.txt of the release.
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (checksum-verified)
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version
      - name: Scan pull request commits
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          "$RUNNER_TEMP/gitleaks" git . --redact --no-banner --verbose --exit-code 1 \
            --log-opts="${BASE_SHA}..${HEAD_SHA}"
      - name: Scan full history
        if: github.event_name != 'pull_request'
        run: |
          "$RUNNER_TEMP/gitleaks" git . --redact --no-banner --verbose --exit-code 1

  # Fails a pull request that adds a dependency with a known high or critical
  # advisory. Results go to the job summary: Dependabot pull requests get a
  # read-only token, so no PR comment is attempted.
  # The action needs the repository's Dependency graph (Settings → Security →
  # Advanced Security). That is the owner's setting: after enabling it, set
  # the repository variable DEPENDENCY_REVIEW=true to switch this job on.
  # Until then `npm audit --audit-level=high` in CI covers known advisories.
  dependency-review:
    if: github.event_name == 'pull_request' && vars.DEPENDENCY_REVIEW == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

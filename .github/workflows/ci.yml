name: CI
on:
  # Branch pushes are covered by their pull request; running both doubles the
  # jobs and has left one queued behind the account's concurrent-job limit.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
# Every action in these workflows is pinned to a full commit SHA with the
# release in a trailing comment; Dependabot (github-actions ecosystem) updates
# both. Resolve a new pin with `gh api repos/OWNER/REPO/git/ref/tags/vX.Y.Z`
# (dereference annotated tags via git/tags/<sha>).
permissions:
  contents: read
jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [22, 24]
        include:
          - os: windows-latest
            node: 24
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: node --check vercel.mjs
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run smoke:qr
      # Standard npm audit: high and critical advisories fail the build, without exceptions.
      - run: npm run audit:ci

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: chromium
            browser: chromium
          - project: firefox
            browser: firefox
          - project: webkit
            browser: webkit
          - project: mobile-chrome
            browser: chromium
    name: e2e (${{ matrix.project }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run build
      - run: npx playwright test --project=${{ matrix.project }}

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build linux/amd64 and linux/arm64 images
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Runs the real image: build commit reporting, one-time scanner enrollment,
  # restart persistence on a named volume, the `verify`, `backup` and `restore`
  # maintenance commands, no secrets in the logs, and a graceful SIGTERM stop.
  docker-run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CONTAINER: gatepass-ci
      VOLUME: gatepass-ci-data
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build linux/amd64 image
        run: docker build --build-arg GATEPASS_COMMIT="$GITHUB_SHA" -t gatepass:ci .
      - name: Persistence, backup/restore, verify and graceful stop
        shell: bash
        run: |
          set -euo pipefail
          BASE=http://127.0.0.1:3000
          TOKEN=ci-operator-token-0123456789abcdef

          wait_healthy() {
            for _ in $(seq 1 45); do
              status=$(docker inspect -f '{{.State.Health.Status}}' "$CONTAINER")
              if [ "$status" = healthy ] && curl -fsS "$BASE/api/health" >/dev/null 2>&1; then
                echo "container healthy"
                return 0
              fi
              sleep 2
            done
            echo "container did not become healthy (last status: $status)" >&2
            docker logs "$CONTAINER" >&2
            return 1
          }
          api() { # api METHOD PATH [JSON]
            curl -fsS -X "$1" "$BASE$2" -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' ${3:+--data "$3"}
          }
          redeem() { # redeem CODE REQUEST_ID
            curl -fsS -X POST "$BASE/api/scanner/redeem" -H "Authorization: Bearer $SCANNER_KEY" \
              -H 'Content-Type: application/json' --data "$(jq -nc --arg code "$1" --arg id "$2" '{code: $code, requestId: $id}')"
          }
          pass_status() { # pass_status PASS_ID -> status, or "absent"
            api GET "/api/events/$EVENT_ID/passes" | jq -r --arg id "$1" '(.[] | select(.id == $id) | .status) // "absent"'
          }
          verify() { # verify [FILE]: exit 0 and "ok": true
            docker exec "$CONTAINER" node dist/server/index.js verify ${1:+"$1"} | tee verify.json
            jq -e '.ok == true' verify.json >/dev/null
          }
          stop_gracefully() {
            docker stop -t 15 "$CONTAINER" >/dev/null
            EXIT_CODE=$(docker inspect -f '{{.State.ExitCode}}' "$CONTAINER")
            echo "exit code after docker stop: $EXIT_CODE"
            [ "$EXIT_CODE" = 0 ]
          }
          iso() { date -u -d "@$(( $(date +%s) + $1 ))" +%Y-%m-%dT%H:%M:%SZ; }

          docker volume create "$VOLUME" >/dev/null
          docker run -d --name "$CONTAINER" -p 127.0.0.1:3000:3000 -v "$VOLUME:/data" \
            -e ADMIN_TOKEN="$TOKEN" -e APP_PUBLIC_URL=http://localhost:3000 gatepass:ci >/dev/null
          wait_healthy

          # The image reports the commit it was built from (health and the static version file).
          HEALTH=$(curl -fsS "$BASE/api/health")
          echo "health: $HEALTH"
          jq -e --arg sha "$GITHUB_SHA" '.ok == true and .build.commit == $sha and (.build.schema | type == "number" and . >= 1)' <<<"$HEALTH" >/dev/null
          curl -fsS "$BASE/version.json" | jq -e --arg sha "$GITHUB_SHA" '.commit == $sha' >/dev/null

          EVENT_ID=$(api POST /api/events "$(jq -nc --arg s "$(iso -3600)" --arg e "$(iso 86400)" \
            '{name: "CI restart check", startsAt: $s, endsAt: $e, status: "active"}')" | jq -er .id)

          # Scanner setup links carry a one-time enrollment code; the device exchanges it for its key.
          ENROLL_URL=$(api POST "/api/events/$EVENT_ID/scanners" '{"label":"CI door"}' | jq -er .enrollment.url)
          ENROLL_CODE=${ENROLL_URL#*#enroll=}
          [ -n "$ENROLL_CODE" ] && [ "$ENROLL_CODE" != "$ENROLL_URL" ]
          enroll() {
            curl -sS -o enroll.json -w '%{http_code}' -X POST "$BASE/api/scanner/enroll" \
              -H 'Content-Type: application/json' --data "$(jq -nc --arg code "$ENROLL_CODE" '{code: $code}')"
          }
          FIRST_USE=$(enroll)
          echo "enrollment: HTTP $FIRST_USE"
          [[ "$FIRST_USE" == 2?? ]]
          SCANNER_KEY=$(jq -er .key enroll.json)
          REUSE=$(enroll)
          echo "second use of the enrollment code: HTTP $REUSE"
          case "$REUSE" in 2*) echo "enrollment code was accepted twice" >&2; exit 1 ;; esac
          rm -f enroll.json

          PASSES=$(api POST "/api/events/$EVENT_ID/passes" '{"count":1}')
          PASS_ID=$(jq -er '.[0].id' <<<"$PASSES")
          PASS_TOKEN=$(jq -er '.[0].token' <<<"$PASSES")
          FIRST=$(redeem "$PASS_TOKEN" ci-first-scan-0001 | jq -er .outcome)
          echo "first scan: $FIRST"
          [ "$FIRST" = admitted ]

          echo "::group::Restart persistence"
          docker restart -t 15 "$CONTAINER" >/dev/null
          wait_healthy
          STATUS=$(pass_status "$PASS_ID")
          echo "pass status after restart: $STATUS"
          [ "$STATUS" = redeemed ]
          SECOND=$(redeem "$PASS_TOKEN" ci-second-scan-0002 | jq -er .outcome)
          echo "re-scan after restart: $SECOND"
          [ "$SECOND" = already_redeemed ]
          verify
          echo "::endgroup::"

          echo "::group::Online backup, then restore into a stopped server"
          docker exec "$CONTAINER" node dist/server/index.js backup /data/backup-ci.db
          verify /data/backup-ci.db
          # Written after the backup, so the restore must drop it.
          LATE_ID=$(api POST "/api/events/$EVENT_ID/passes" '{"count":1}' | jq -er '.[0].id')
          [ "$(pass_status "$LATE_ID")" = active ]
          stop_gracefully
          docker run --rm -v "$VOLUME:/data" gatepass:ci node dist/server/index.js restore /data/backup-ci.db
          docker start "$CONTAINER" >/dev/null
          wait_healthy
          STATUS=$(pass_status "$PASS_ID")
          echo "admitted pass after restore: $STATUS"
          [ "$STATUS" = redeemed ]
          LATE=$(pass_status "$LATE_ID")
          echo "pass issued after the backup, after restore: $LATE"
          [ "$LATE" = absent ]
          THIRD=$(redeem "$PASS_TOKEN" ci-third-scan-0003 | jq -er .outcome)
          echo "re-scan after restore: $THIRD"
          [ "$THIRD" = already_redeemed ]
          verify
          echo "::endgroup::"

          stop_gracefully
          docker logs "$CONTAINER" > container.log 2>&1
          tail -n 5 container.log
          # Credentials and pass tokens must never reach the logs.
          for secret in "$TOKEN" "$SCANNER_KEY" "$ENROLL_CODE" "$PASS_TOKEN"; do
            if grep -qF -- "$secret" container.log; then
              echo "a credential or pass token appears in the container log" >&2
              exit 1
            fi
          done
      - name: Remove container and volume
        if: always()
        run: |
          docker rm -f "$CONTAINER" || true
          docker volume rm "$VOLUME" || true
